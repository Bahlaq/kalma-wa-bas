# Codemagic: Android debug APK + iOS TestFlight
# Flutter project lives in /app
#
# iOS Bundle ID: com.bahlaq.kalmaWaBas
# App Store Connect integration: naqel_asc
#
# IMPORTANT — shared Distribution certificate (same Apple team as naqel-driver):
# Apple allows only ~2–3 Distribution certs. Do NOT openssl-gen a new key per build.
# Store ONE RSA private key as Codemagic global variable CERTIFICATE_PRIVATE_KEY
# (Team → codemagic.yaml settings → Global variables and secrets) and reuse it for
# kalma-wa-bas + naqel-driver + naqel-user.
#
# If builds still 409 "already have a Distribution certificate":
# delete one unused "Created via API" Distribution cert at developer.apple.com,
# then rebuild once so this shared key can create/match a single cert.

workflows:
  kalma-android-apk:
    name: Kalma Wa Bas — Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.bahlaq.kalma_wa_bas"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/app/android/local.properties"
      - name: Get packages
        script: |
          cd app
          flutter pub get
      - name: Analyze
        script: |
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        script: |
          cd app
          flutter test
      - name: Build debug APK
        script: |
          cd app
          flutter build apk --debug
    artifacts:
      - app/build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true

  kalma-ios-testflight:
    name: Kalma Wa Bas — iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: naqel_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.bahlaq.kalmaWaBas
        P12_PASSWORD: "123456"
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files with shared Distribution key
        script: |
          set -e
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Missing CERTIFICATE_PRIVATE_KEY."
            echo "Add it once under Codemagic → Team → Global variables and secrets"
            echo "(PEM including BEGIN/END RSA PRIVATE KEY). Reuse the SAME key for naqel apps."
            echo "Generate once: openssl genrsa -out ios_distribution_private_key.pem 2048"
            exit 1
          fi
          mkdir -p /tmp/certs "$CM_BUILD_DIR/app/build/ios/ipa"
          # CLI also reads CERTIFICATE_PRIVATE_KEY from the environment automatically.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --certificates-dir=/tmp/certs \
            --p12-password="$P12_PASSWORD"
      - name: Export shared Distribution certificate as p12
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/app/build/ios/ipa"
          echo "Contents of /tmp/certs:"
          ls -la /tmp/certs || true
          P12_FILE="$(find /tmp/certs -type f -name 'DISTRIBUTION_*.p12' | head -n 1)"
          if [ -z "$P12_FILE" ]; then
            P12_FILE="$(find /tmp/certs -type f -name '*.p12' | head -n 1)"
          fi
          if [ -z "$P12_FILE" ]; then
            echo "No DISTRIBUTION p12 found in /tmp/certs"
            exit 1
          fi
          cp "$P12_FILE" "$CM_BUILD_DIR/app/build/ios/ipa/shared_dist_cert.p12"
          ls -la "$CM_BUILD_DIR/app/build/ios/ipa/shared_dist_cert.p12"
      - name: Add certificates to keychain
        script: |
          set -e
          shopt -s nullglob
          CERTS=(/tmp/certs/*.p12)
          if [ ${#CERTS[@]} -eq 0 ]; then
            echo "No .p12 files in /tmp/certs"
            ls -la /tmp/certs || true
            exit 1
          fi
          for p12 in "${CERTS[@]}"; do
            echo "Adding $p12 to keychain"
            keychain add-certificates \
              --certificate "$p12" \
              --certificate-password "$P12_PASSWORD"
          done
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get packages
        script: |
          cd app
          flutter pub get
      - name: Install CocoaPods
        script: |
          find "$CM_BUILD_DIR/app/ios" -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          set -e
          cd app
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
      - app/build/ios/ipa/shared_dist_cert.p12
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
