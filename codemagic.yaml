workflows:
  kalma-android:
    name: Kalma Wa Bas Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.bahlaq.kalma_wa_bas"
    scripts:
      - name: Get packages
        script: |
          cd app
          flutter pub get
      - name: Analyze
        script: |
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        script: |
          cd app
          flutter test
      - name: Build Android APK
        script: |
          cd app
          flutter build apk --release
    artifacts:
      - app/build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true
