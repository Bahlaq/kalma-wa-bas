# Codemagic: Android debug APK + iOS TestFlight
# Flutter project lives in /app
#
# iOS Bundle IDs (from app/ios/Runner.xcodeproj/project.pbxproj):
#   App target:  com.bahlaq.kalmaWaBas
#   Tests only:  com.bahlaq.kalmaWaBas.RunnerTests  (not shipped; no App Store profile)
# No app extensions found.
#
# Codemagic UI: App Store Connect integration must be named `naqel_asc`
# (API key with App Manager). Signing files are fetched via API (--create);
# do not run keychain add-certificates before fetch-signing-files.

workflows:
  kalma-android-apk:
    name: Kalma Wa Bas — Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.bahlaq.kalma_wa_bas"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/app/android/local.properties"
      - name: Get packages
        script: |
          cd app
          flutter pub get
      - name: Analyze
        script: |
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        script: |
          cd app
          flutter test
      - name: Build debug APK
        script: |
          cd app
          flutter build apk --debug
    artifacts:
      - app/build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true

  kalma-ios-testflight:
    name: Kalma Wa Bas — iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: naqel_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.bahlaq.kalmaWaBas
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get packages
        script: |
          cd app
          flutter pub get
      - name: Install CocoaPods
        script: |
          find "$CM_BUILD_DIR/app/ios" -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          cd app
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
