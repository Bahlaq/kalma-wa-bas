# Codemagic: Android APK + AAB + iOS TestFlight
# Flutter project lives in /app
# Signing matches Bahlaq/naqel-driver (naqel_asc + CERTIFICATE_PRIVATE_KEY)

workflows:
  android_apk:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.2
      groups:
        - android_credentials
      vars:
        PREVIOUS_STORE_BUILD: "1"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/app/android/local.properties"
      - name: Set up Android keystore
        script: |
          set -e
          # Kalma gradle.kts reads CM_KEYSTORE_PATH directly when CI=true.
          # Also write key.properties for consistency if using base64 CM_KEYSTORE.
          if [ -n "${CM_KEYSTORE_PATH:-}" ]; then
            echo "Using Codemagic CM_KEYSTORE_PATH=$CM_KEYSTORE_PATH"
          elif [ -n "${CM_KEYSTORE:-}" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/app/android/keystore.jks"
            export CM_KEYSTORE_PATH="$CM_BUILD_DIR/app/android/keystore.jks"
            echo "Decoded CM_KEYSTORE to $CM_KEYSTORE_PATH"
            # Persist for subsequent scripts in this build
            echo "CM_KEYSTORE_PATH=$CM_KEYSTORE_PATH" >> "$CM_ENV"
          else
            echo "WARNING: No Android keystore configured (will fall back to debug signing)."
            echo "Set Codemagic group android_credentials:"
            echo "  CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD"
          fi
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Build release APK
        script: |
          set -e
          cd app
          NEW_BUILD=$((PREVIOUS_STORE_BUILD + BUILD_NUMBER))
          echo "Building APK with build-number=$NEW_BUILD"
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number="$NEW_BUILD"
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true

  android_aab:
    name: Android AAB (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.2
      groups:
        - android_credentials
      vars:
        PREVIOUS_STORE_BUILD: "1"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/app/android/local.properties"
      - name: Set up Android keystore
        script: |
          set -e
          if [ -n "${CM_KEYSTORE_PATH:-}" ]; then
            echo "Using Codemagic CM_KEYSTORE_PATH=$CM_KEYSTORE_PATH"
          elif [ -n "${CM_KEYSTORE:-}" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/app/android/keystore.jks"
            echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/app/android/keystore.jks" >> "$CM_ENV"
            echo "Decoded CM_KEYSTORE"
          else
            echo "Missing Android keystore. AAB requires release signing."
            echo "Configure Codemagic group android_credentials with:"
            echo "  CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD"
            exit 1
          fi
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Build release App Bundle
        script: |
          set -e
          cd app
          NEW_BUILD=$((PREVIOUS_STORE_BUILD + BUILD_NUMBER))
          echo "Building AAB with build-number=$NEW_BUILD"
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number="$NEW_BUILD"
    artifacts:
      - app/build/app/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true

  ios_testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: naqel_asc
    environment:
      flutter: 3.38.2
      xcode: latest
      cocoapods: default
      groups:
        - code_signing
      vars:
        BUNDLE_ID: com.bahlaq.kalmaWaBas
        PREVIOUS_STORE_BUILD: "1"
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files with shared Distribution private key
        script: |
          set -e
          mkdir -p /tmp/certs "$CM_BUILD_DIR/app/build/ios/ipa"
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Missing CERTIFICATE_PRIVATE_KEY in Codemagic group 'code_signing'."
            echo "Use the private key of an EXISTING Apple Distribution certificate."
            exit 1
          fi
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_key.pem \
            --certificates-dir=/tmp/certs \
            --p12-password=123456
      - name: Export shared Distribution certificate as p12
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/app/build/ios/ipa"
          ls -la /tmp/certs || true
          P12_FILE="$(find /tmp/certs -type f -name 'DISTRIBUTION_*.p12' | head -n 1)"
          if [ -z "$P12_FILE" ]; then
            P12_FILE="$(find /tmp/certs -type f -name '*.p12' | head -n 1)"
          fi
          if [ -z "$P12_FILE" ]; then
            echo "No DISTRIBUTION p12 found in /tmp/certs"
            exit 1
          fi
          cp "$P12_FILE" "$CM_BUILD_DIR/app/build/ios/ipa/shared_dist_cert.p12"
          echo "Copied shared_dist_cert.p12 (password: 123456)"
      - name: Add certificates to keychain
        script: |
          set -e
          shopt -s nullglob
          CERTS=(/tmp/certs/*.p12)
          if [ ${#CERTS[@]} -eq 0 ]; then
            echo "No .p12 files in /tmp/certs"
            exit 1
          fi
          for p12 in "${CERTS[@]}"; do
            echo "Adding $p12 to keychain"
            keychain add-certificates \
              --certificate "$p12" \
              --certificate-password 123456
          done
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find "$CM_BUILD_DIR/app/ios" -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          set -e
          cd app
          NEW_BUILD=$((PREVIOUS_STORE_BUILD + BUILD_NUMBER))
          echo "Building IPA with build-number=$NEW_BUILD"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$NEW_BUILD" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
      - app/build/ios/ipa/shared_dist_cert.p12
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
