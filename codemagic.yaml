# Codemagic: Android APK + AAB + iOS TestFlight
# Flutter project lives in /app

workflows:
  android_apk:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.2
      groups:
        - android_credentials
      vars:
        PREVIOUS_STORE_BUILD: "1"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/app/android/local.properties"
      - name: Set up Android keystore (optional for APK)
        script: |
          set -e
          if [ -n "${CM_KEYSTORE_PATH:-}" ]; then
            echo "HAS_RELEASE_KEYSTORE=1" >> "$CM_ENV"
            echo "Using CM_KEYSTORE_PATH=$CM_KEYSTORE_PATH"
          elif [ -n "${CM_KEYSTORE:-}" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/app/android/keystore.jks"
            echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/app/android/keystore.jks" >> "$CM_ENV"
            echo "HAS_RELEASE_KEYSTORE=1" >> "$CM_ENV"
            echo "Decoded CM_KEYSTORE"
          else
            echo "HAS_RELEASE_KEYSTORE=0" >> "$CM_ENV"
            echo "No android_credentials keystore — will build debug APK"
          fi
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Build APK
        script: |
          set -e
          cd app
          NEW_BUILD=$((PREVIOUS_STORE_BUILD + BUILD_NUMBER))
          if [ "${HAS_RELEASE_KEYSTORE:-0}" = "1" ]; then
            echo "Building release APK build-number=$NEW_BUILD"
            flutter build apk --release \
              --build-name=1.0.0 \
              --build-number="$NEW_BUILD"
          else
            echo "Building debug APK (no keystore)"
            flutter build apk --debug
          fi
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true

  android_aab:
    name: Android AAB Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.2
      groups:
        - android_signing
      vars:
        PREVIOUS_STORE_BUILD: "1"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/app/android/local.properties"
      - name: Decode keystore for release signing
        script: |
          set -e
          if [ -z "${CM_KEYSTORE:-}" ] || [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || [ -z "${CM_KEY_ALIAS:-}" ] || [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "Missing android_signing vars. Required:"
            echo "  CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD"
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/app/android/keystore.jks"
          echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/app/android/keystore.jks" >> "$CM_ENV"
          echo "Decoded CM_KEYSTORE to $CM_BUILD_DIR/app/android/keystore.jks"
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Build signed release App Bundle
        script: |
          set -e
          cd app
          NEW_BUILD=$((PREVIOUS_STORE_BUILD + BUILD_NUMBER))
          echo "Building AAB with build-number=$NEW_BUILD"
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number="$NEW_BUILD"
    artifacts:
      - app/build/app/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true

  ios_testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: naqel_asc
    environment:
      flutter: 3.38.2
      xcode: latest
      cocoapods: default
      groups:
        - code_signing
      vars:
        BUNDLE_ID: com.bahlaq.kalmaWaBas
        PREVIOUS_STORE_BUILD: "1"
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          set -e
          mkdir -p /tmp/certs "$CM_BUILD_DIR/app/build/ios/ipa"
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Using CERTIFICATE_PRIVATE_KEY from code_signing group"
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          else
            echo "CERTIFICATE_PRIVATE_KEY not set — generating temporary key (openssl genrsa)"
            openssl genrsa -out /tmp/cert_key.pem 2048
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_key.pem \
            --certificates-dir=/tmp/certs \
            --p12-password=123456
      - name: Export shared Distribution certificate as p12
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/app/build/ios/ipa"
          ls -la /tmp/certs || true
          P12_FILE="$(find /tmp/certs -type f -name 'DISTRIBUTION_*.p12' | head -n 1)"
          if [ -z "$P12_FILE" ]; then
            P12_FILE="$(find /tmp/certs -type f -name '*.p12' | head -n 1)"
          fi
          if [ -z "$P12_FILE" ]; then
            echo "No DISTRIBUTION p12 found in /tmp/certs"
            exit 1
          fi
          cp "$P12_FILE" "$CM_BUILD_DIR/app/build/ios/ipa/shared_dist_cert.p12"
          echo "Copied shared_dist_cert.p12 (password: 123456)"
      - name: Add certificates to keychain
        script: |
          set -e
          shopt -s nullglob
          CERTS=(/tmp/certs/*.p12)
          if [ ${#CERTS[@]} -eq 0 ]; then
            echo "No .p12 files in /tmp/certs"
            exit 1
          fi
          for p12 in "${CERTS[@]}"; do
            echo "Adding $p12 to keychain"
            keychain add-certificates \
              --certificate "$p12" \
              --certificate-password 123456
          done
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find "$CM_BUILD_DIR/app/ios" -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          set -e
          cd app
          NEW_BUILD=$((PREVIOUS_STORE_BUILD + BUILD_NUMBER))
          echo "Building IPA with build-number=$NEW_BUILD"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$NEW_BUILD" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
      - app/build/ios/ipa/shared_dist_cert.p12
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - m.bahlaq94@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
